<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Registry placeholder mark for Windows App</title>
  <desc id="desc">Four panes of a window, drawn for this registry until the official mark is available</desc>
  <defs>
    <linearGradient id="windows-app-face" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1769aa"/>
      <stop offset="1" stop-color="#0d4776"/>
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="54" height="54" rx="12" fill="url(#windows-app-face)"/>
  <rect x="17" y="17" width="12.5" height="12.5" rx="1.5" fill="#fff" opacity=".92"/>
  <rect x="34.5" y="17" width="12.5" height="12.5" rx="1.5" fill="#fff" opacity=".92"/>
  <rect x="17" y="34.5" width="12.5" height="12.5" rx="1.5" fill="#fff" opacity=".92"/>
  <rect x="34.5" y="34.5" width="12.5" height="12.5" rx="1.5" fill="#ffb900"/>
</svg>
